apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keploy-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: keploy
            - name: POSTGRES_PASSWORD
              value: keploy
            - name: POSTGRES_DB
              value: keploy
          ports:
            - name: postgres
              containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keploy-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keploy-recorder
  template:
    metadata:
      labels:
        app: keploy-recorder
    spec:
      hostPID: __HOST_PID__
      # Without this the application can start before Postgres accepts
      # connections, and its failed retries end up in the recorded mocks.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U keploy; do sleep 1; done"]
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Never
          securityContext: __SECURITY_CONTEXT__
          command: ["/bin/sh", "-c"]
          args:
            - |
              __NOISE_SETUP__
              mountpoint -q /sys/kernel/debug || mount -t debugfs debugfs /sys/kernel/debug
              mountpoint -q /sys/kernel/tracing || mount -t tracefs tracefs /sys/kernel/tracing
              exec keploy record --path /data --disableANSI -c "node /app/app.js"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: keploy-data
              mountPath: /data
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tracefs
              mountPath: /sys/kernel/tracing
      volumes:
        - name: keploy-data
          persistentVolumeClaim:
            claimName: keploy-data
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: keploy-notes
spec:
  selector:
    app: keploy-recorder
  ports:
    - name: http
      port: 8080
      targetPort: http
