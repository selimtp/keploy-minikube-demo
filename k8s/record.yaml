apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keploy-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keploy-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keploy-recorder
  template:
    metadata:
      labels:
        app: keploy-recorder
    spec:
      hostPID: __HOST_PID__
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Never
          securityContext: __SECURITY_CONTEXT__
          command: ["/bin/sh", "-c"]
          args:
            - |
              __NOISE_SETUP__
              mountpoint -q /sys/kernel/debug || mount -t debugfs debugfs /sys/kernel/debug
              mountpoint -q /sys/kernel/tracing || mount -t tracefs tracefs /sys/kernel/tracing
              exec keploy record --path /data --disableANSI -c "node /app/app.js"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: keploy-data
              mountPath: /data
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tracefs
              mountPath: /sys/kernel/tracing
      volumes:
        - name: keploy-data
          persistentVolumeClaim:
            claimName: keploy-data
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: keploy-notes
spec:
  selector:
    app: keploy-recorder
  ports:
    - name: http
      port: 8080
      targetPort: http
