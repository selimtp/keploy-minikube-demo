apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keploy-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keploy-recorder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keploy-recorder
  template:
    metadata:
      labels:
        app: keploy-recorder
    spec:
      hostPID: true
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Never
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - exec keploy record --path /data --disableANSI -c "node /app/app.js"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
          volumeMounts:
            - name: keploy-data
              mountPath: /data
      volumes:
        - name: keploy-data
          persistentVolumeClaim:
            claimName: keploy-data
---
apiVersion: v1
kind: Service
metadata:
  name: keploy-notes
spec:
  selector:
    app: keploy-recorder
  ports:
    - name: http
      port: 8080
      targetPort: http

