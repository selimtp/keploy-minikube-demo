apiVersion: batch/v1
kind: Job
metadata:
  name: keploy-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      hostPID: true
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Never
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - exec keploy test --path /data --disableANSI --delay 5 -c "node /app/app.js"
          volumeMounts:
            - name: keploy-data
              mountPath: /data
      volumes:
        - name: keploy-data
          persistentVolumeClaim:
            claimName: keploy-data

