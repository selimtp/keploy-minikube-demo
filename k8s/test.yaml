apiVersion: batch/v1
kind: Job
metadata:
  # Suffixed because a Job is immutable: replaying the same recordings a second
  # time needs a second Job, not an update to this one.
  name: keploy-test-__RUN_ID__
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        # Load-bearing, do not remove. The recorded test cases target
        # http://keploy-notes:8080, so during replay the keploy-notes Service must
        # resolve to this pod. The recorder Deployment is already gone by then, and
        # this label is what makes the Service select the Job pod instead.
        app: keploy-recorder
    spec:
      restartPolicy: Never
      hostPID: __HOST_PID__
      # Deliberately no Postgres and no wait-for-postgres init container. If the
      # replay succeeds here, every database call was served from a recorded mock.
      containers:
        - name: app
          image: __APP_IMAGE__
          imagePullPolicy: Never
          securityContext: __SECURITY_CONTEXT__
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -o pipefail
              __NOISE_SETUP__
              mountpoint -q /sys/kernel/debug || mount -t debugfs debugfs /sys/kernel/debug
              mountpoint -q /sys/kernel/tracing || mount -t tracefs tracefs /sys/kernel/tracing

              # One line per test-set. Recording twice never overwrites: Keploy
              # takes the next free number, so a second recorder lifecycle adds
              # test-set-1 next to test-set-0 and this replay runs both.
              echo "===== Test sets on the volume ====="
              for d in /data/keploy/test-set-*; do
                test -d "$d" || continue
                echo "$d: $(find "$d/tests" -name '*.yaml' | wc -l) test cases"
              done
              echo "==================================="

              # Dumped here rather than during recording: Keploy flushes the test
              # files when it shuts down, so they are only complete once the
              # recorder Deployment is gone.
              echo "===== Recorded test cases ====="
              find /data/keploy -path '*/tests/*.yaml' | sort | while read -r f; do
                echo "--- $f"
                cat "$f"
              done
              echo "===== End recorded test cases ====="

              # Proof that the Postgres conversation was captured. Summarised by
              # kind because the full wire-protocol dump is very large.
              echo "===== Recorded mocks ====="
              find /data/keploy -name 'mocks.yaml' | sort | while read -r f; do
                echo "--- $f ($(wc -l < "$f") lines)"
                grep -h '^kind:' "$f" | sort | uniq -c
              done
              echo "=========================="

              __REGRESSION_SETUP__

              # Proof of what the replayed application will actually answer. Reads
              # "ok" when no regression was injected, "healthy" when one was. If the
              # substitution never happened, a green build means nothing.
              echo "===== /health source after regression setup ====="
              grep -n status /app/app.js
              echo "================================================="

              keploy test --path /data --disableANSI --delay __TEST_DELAY__ -c "node /app/app.js" 2>&1 | tee /tmp/keploy-test.log
              KEPLOY_STATUS=${PIPESTATUS[0]}

              # Must stay directly after the PIPESTATUS capture above: any command
              # in between overwrites it and Keploy's exit code is lost.
              echo "===== Coverage output ====="
              nyc report --reporter=text --temp-directory=/app/.nyc_output || true
              echo "=========================="

              # Replaying does not touch tests/ or mocks.yaml; the only thing a
              # run writes is a report directory. Running twice therefore leaves
              # two of them side by side rather than replacing the first.
              echo "===== Report directories ====="
              find /data/keploy/reports -type f | sort
              echo "===== Report summaries ====="
              find /data/keploy/reports -name '*report.yaml' | sort | while read -r f; do
                echo "--- $f"
                grep -E '^(status|success|failure|total|ignored):' "$f" || true
              done
              echo "=============================="

              if grep -Eq 'Total test failed:[[:space:]]*[1-9][0-9]*' /tmp/keploy-test.log; then
                echo "Keploy reported failed tests"
                exit 1
              fi
              if ! grep -Eq 'Total test failed:[[:space:]]*0' /tmp/keploy-test.log; then
                echo "Keploy did not produce a successful test summary"
                exit 1
              fi
              exit "$KEPLOY_STATUS"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: keploy-data
              mountPath: /data
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: tracefs
              mountPath: /sys/kernel/tracing
      volumes:
        - name: keploy-data
          persistentVolumeClaim:
            claimName: keploy-data
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
